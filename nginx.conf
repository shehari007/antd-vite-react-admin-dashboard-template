server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Hashed asset filenames change whenever their contents do, so they are safe
  # to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or visitors keep loading an old build that
  # points at asset filenames which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # React Router owns the URL space. Anything that is not a real file falls
  # through to index.html so a refresh on /dashboard/products still works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
