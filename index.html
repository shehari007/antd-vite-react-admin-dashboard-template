<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ViteDash | React 19 + Vite 8 + Ant Design 6 Admin Dashboard</title>
    <meta
      name="description"
      content="ViteDash is a free open source admin dashboard template built with React 19, Vite 8, and Ant Design 6. Role aware navigation, light and dark themes, right to left support, charts, and 25 ready made pages."
    />
    <meta name="author" content="Muhammad Sheharyar Butt" />
    <meta name="theme-color" content="#101b34" />

    <!-- Open Graph and Twitter cards. Without these the link previews as a bare
         URL when someone shares the demo. Replace og:image with a 1200x630 PNG
         of your own dashboard before launch. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ViteDash" />
    <meta
      property="og:title"
      content="ViteDash, a React 19 + Ant Design 6 admin dashboard template"
    />
    <meta
      property="og:description"
      content="Free and open source admin dashboard template. Role aware navigation, light and dark themes, right to left support, charts, and 25 ready made pages."
    />
    <meta property="og:url" content="https://vitedash.msyb.dev" />
    <meta property="og:image" content="https://vitedash.msyb.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ViteDash, a React 19 + Ant Design 6 admin dashboard template"
    />
    <meta
      name="twitter:description"
      content="Free and open source admin dashboard template built with React 19, Vite 8, and Ant Design 6."
    />
    <meta name="twitter:image" content="https://vitedash.msyb.dev/og-image.png" />

    <link rel="canonical" href="https://vitedash.msyb.dev" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Inter is installed as a dependency and bundled by Vite, see main.jsx.
         Loading it from fonts.googleapis.com instead would block the first
         paint on a third party request, break offline development, and hand a
         visitor's IP address to Google on every page view. -->

    <style>
      /* Shown until React mounts. Without it the page is blank white in light
         mode and blank white in dark mode too, which reads as a broken app on a
         slow connection. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
      }
      #app-splash span {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(22, 119, 255, 0.25);
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: #141414;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash span {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash"><span></span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
